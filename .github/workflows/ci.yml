name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t finance-dashboard .

      - name: Run unit tests
        run: docker run --rm -v ${{ github.workspace }}/test-results:/app/test-results finance-dashboard python -m pytest tests/unit/ -v --tb=short --junitxml=/app/test-results/unit-results.xml

      - name: Run integration tests
        run: docker run --rm -v ${{ github.workspace }}/test-results:/app/test-results finance-dashboard python -m pytest tests/integration/ -v --tb=short --junitxml=/app/test-results/integration-results.xml

      - name: Test Summary
        if: always()
        run: |
          python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          import glob, os

          print("## 🧪 Test Results\n")
          total_tests = total_passed = total_failed = total_skipped = total_errors = 0

          for xml_file in sorted(glob.glob("test-results/*.xml")):
              tree = ET.parse(xml_file)
              root = tree.getroot()
              suite_name = os.path.basename(xml_file).replace("-results.xml", "").replace("-", " ").title()

              # Aggregate from <testsuite> elements (pytest puts attrs there, not on root <testsuites>)
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = tests - failures - errors - skipped
              time_taken = sum(float(s.attrib.get("time", 0)) for s in suites)

              total_tests += tests
              total_passed += passed
              total_failed += failures + errors
              total_skipped += skipped

              status = "✅" if (failures + errors) == 0 else "❌"
              print(f"### {status} {suite_name} Tests\n")
              print(f"| Metric | Count |")
              print(f"|--------|-------|")
              print(f"| Total | {tests} |")
              print(f"| ✅ Passed | {passed} |")
              print(f"| ❌ Failed | {failures + errors} |")
              print(f"| ⏭️ Skipped | {skipped} |")
              print(f"| ⏱️ Duration | {time_taken:.2f}s |")
              print()

              # Show individual test details
              for testcase in root.iter("testcase"):
                  tc_name = testcase.attrib.get("name", "unknown")
                  tc_time = float(testcase.attrib.get("time", 0))
                  failure = testcase.find("failure")
                  error = testcase.find("error")
                  skip = testcase.find("skipped")
                  if failure is not None:
                      print(f"- ❌ `{tc_name}` ({tc_time:.2f}s)")
                      print(f"  > {failure.attrib.get('message', '')[:200]}")
                  elif error is not None:
                      print(f"- ❌ `{tc_name}` ({tc_time:.2f}s)")
                      print(f"  > {error.attrib.get('message', '')[:200]}")
                  elif skip is not None:
                      print(f"- ⏭️ `{tc_name}`")
                  else:
                      print(f"- ✅ `{tc_name}` ({tc_time:.2f}s)")
              print()

          overall = "✅ All tests passed" if total_failed == 0 else f"❌ {total_failed} test(s) failed"
          print(f"---\n### Summary: {overall}\n")
          print(f"**Total: {total_tests}** | Passed: {total_passed} | Failed: {total_failed} | Skipped: {total_skipped}")
          EOF
