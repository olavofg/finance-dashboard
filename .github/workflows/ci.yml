name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t finance-dashboard .

      - name: Run unit tests
        run: docker run --rm -v ${{ github.workspace }}/test-results:/app/test-results finance-dashboard python -m pytest tests/unit/ -v --tb=short --junitxml=/app/test-results/unit-results.xml

      - name: Run integration tests
        run: docker run --rm -v ${{ github.workspace }}/test-results:/app/test-results finance-dashboard python -m pytest tests/integration/ -v --tb=short --junitxml=/app/test-results/integration-results.xml

      - name: Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: test-results/*.xml
