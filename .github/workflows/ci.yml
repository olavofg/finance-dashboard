name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t finance-dashboard .

      - name: Run unit tests
        run: docker run --rm finance-dashboard python -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: docker run --rm finance-dashboard python -m pytest tests/integration/ -v --tb=short
